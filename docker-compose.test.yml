# Self-contained test stack (separate project, throwaway tmpfs storage):
#   docker compose -f docker-compose.test.yml run --rm --build tests
#   docker compose -f docker-compose.test.yml down -v
name: localops-test

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: localops_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-superuser
      LOCALOPS_OWNER_PASSWORD: test-owner
      LOCALOPS_APP_PASSWORD: test-app
    volumes:
      - ./deployment/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d localops_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build: { context: ./backend, target: test }
    environment:
      LOCALOPS_TEST_DB: "1"
      APP_ENV: test
      APP_SECRET_KEY: test-secret-key-0123456789abcdef0123456789
      DB_HOST: postgres
      DB_NAME: localops_test
      DB_OWNER_PASSWORD: test-owner
      DB_APP_PASSWORD: test-app
      QDRANT_URL: http://127.0.0.1:1
    depends_on:
      postgres: { condition: service_healthy }
