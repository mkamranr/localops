# LocalOps — base deployment (CPU only, no GPU required).
#   cp .env.example .env   # then set every CHANGE_ME value
#   docker compose up -d --build
# Only the nginx reverse proxy publishes a port (LOCALOPS_HTTP_PORT, default 8300).
# HTTPS: add -f docker-compose.tls.yml (see docs/installation.md). Air-gapped installs
# use the offline bundle (docs/airgap-installation.md).

name: localops

# Every container: no privilege escalation, no Linux capabilities unless listed,
# rotated logs.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

# Application containers also get a read-only root filesystem.
x-readonly: &readonly
  read_only: true
  tmpfs: ["/tmp:size=256m"]

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-localops}
  DB_APP_USER: localops_app
  DB_APP_PASSWORD: ${LOCALOPS_APP_PASSWORD:?set LOCALOPS_APP_PASSWORD in .env}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  AUTH_MODE: ${AUTH_MODE:-local}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  ENABLE_TELEMETRY: "false"
  LOCALOPS_ENCRYPTION_KEY: ${LOCALOPS_ENCRYPTION_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  KNOWLEDGE_MAX_UPLOAD_MB: ${KNOWLEDGE_MAX_UPLOAD_MB:-10}
  KNOWLEDGE_CHUNK_CHARS: ${KNOWLEDGE_CHUNK_CHARS:-2400}
  KNOWLEDGE_CHUNK_OVERLAP: ${KNOWLEDGE_CHUNK_OVERLAP:-300}
  MCP_DEFAULT_TIMEOUT_SECONDS: ${MCP_DEFAULT_TIMEOUT_SECONDS:-30}
  INVESTIGATION_TIMEOUT_SECONDS: ${INVESTIGATION_TIMEOUT_SECONDS:-1800}
  INVESTIGATION_MAX_CLARIFICATIONS: ${INVESTIGATION_MAX_CLARIFICATIONS:-2}
  INVESTIGATION_MAX_TOOL_CALLS: ${INVESTIGATION_MAX_TOOL_CALLS:-30}
  TOOL_OUTPUT_MODEL_BYTES: ${TOOL_OUTPUT_MODEL_BYTES:-6000}
  INCIDENT_AUTO_CREATE: ${INCIDENT_AUTO_CREATE:-true}
  REMEDIATION_ENABLED: ${REMEDIATION_ENABLED:-true}
  REMEDIATION_MAX_STEPS: ${REMEDIATION_MAX_STEPS:-3}
  APPROVAL_DEFAULT_TTL_MINUTES: ${APPROVAL_DEFAULT_TTL_MINUTES:-60}
  VERIFICATION_DELAY_SECONDS: ${VERIFICATION_DELAY_SECONDS:-5}
  DISCOVERY_CONCURRENCY: ${DISCOVERY_CONCURRENCY:-8}
  DISCOVERY_MAX_TARGETS: ${DISCOVERY_MAX_TARGETS:-500}
  METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-30}
  # Air-gapped: LangGraph/LangChain must never try to reach LangSmith.
  LANGSMITH_TRACING: "false"
  LANGCHAIN_TRACING_V2: "false"
  # Defence in depth: no library may try to download models or send usage data.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  DO_NOT_TRACK: "1"

services:
  postgres:
    <<: *hardening
    # The entrypoint prepares the data directory as root, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    image: postgres:16.6-alpine
    container_name: localops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-localops}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      LOCALOPS_OWNER_PASSWORD: ${LOCALOPS_OWNER_PASSWORD:?set LOCALOPS_OWNER_PASSWORD in .env}
      LOCALOPS_APP_PASSWORD: ${LOCALOPS_APP_PASSWORD:?set LOCALOPS_APP_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployment/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    <<: *hardening
    cap_add: [CHOWN, SETGID, SETUID]
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    image: redis:7.4.2-alpine
    container_name: localops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  qdrant:
    <<: *hardening
    mem_limit: ${QDRANT_MEM_LIMIT:-2g}
    image: qdrant/qdrant:v1.13.2
    container_name: localops-qdrant
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The qdrant image ships without curl/wget; probe the port with bash.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  # One-shot: apply migrations (as schema owner), then idempotent bootstrap.
  migrate:
    <<: [*hardening, *readonly]
    image: localops-backend:${LOCALOPS_VERSION:-dev}
    build:
      context: ./backend
      target: runtime
      args:
        LOCALOPS_VERSION: ${LOCALOPS_VERSION:-dev}
        GIT_REVISION: ${GIT_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: localops-migrate
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli bootstrap"]
    environment:
      <<: *backend-env
      DB_OWNER_USER: localops_owner
      DB_OWNER_PASSWORD: ${LOCALOPS_OWNER_PASSWORD}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@localops.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_CREATE_DEFAULT_TENANT: ${BOOTSTRAP_CREATE_DEFAULT_TENANT:-true}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: "no"
    networks: [internal]

  api:
    <<: [*hardening, *readonly]
    mem_limit: ${API_MEM_LIMIT:-2g}
    image: localops-backend:${LOCALOPS_VERSION:-dev}
    container_name: localops-api
    restart: unless-stopped
    environment: *backend-env
    # Lets endpoints like http://host.docker.internal:11434 reach a model server on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    networks: [internal]

  worker:
    <<: [*hardening, *readonly]
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    image: localops-backend:${LOCALOPS_VERSION:-dev}
    container_name: localops-worker
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *backend-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [internal]

  frontend:
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp:size=64m", "/var/cache/nginx:size=64m"]
    mem_limit: 256m
    image: localops-frontend:${LOCALOPS_VERSION:-dev}
    build:
      context: ./frontend
      args:
        LOCALOPS_VERSION: ${LOCALOPS_VERSION:-dev}
        GIT_REVISION: ${GIT_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: localops-frontend
    restart: unless-stopped
    networks: [internal]

  nginx:
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp:size=64m", "/var/cache/nginx:size=64m"]
    mem_limit: 256m
    image: nginxinc/nginx-unprivileged:1.27.3-alpine
    container_name: localops-nginx
    restart: unless-stopped
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${LOCALOPS_HTTP_PORT:-8300}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
    networks: [internal, edge]

networks:
  internal: {}
  edge: {}

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
