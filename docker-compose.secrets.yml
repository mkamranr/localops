# Docker secrets instead of secret values in .env. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
# Each secret is one file under ./secrets/ (directory mode 700, files mode 644 so the
# unprivileged container users can read them through the bind mount). In .env, set the
# matching variables to the placeholder "docker-secret" (the base file requires them to
# be non-empty); this override blanks them inside the containers. The application reads
# <NAME>_FILE for any setting; PostgreSQL reads POSTGRES_PASSWORD_FILE.

secrets:
  app_secret_key: { file: ./secrets/app_secret_key }
  postgres_superuser_password: { file: ./secrets/postgres_superuser_password }
  localops_owner_password: { file: ./secrets/localops_owner_password }
  localops_app_password: { file: ./secrets/localops_app_password }
  localops_encryption_key: { file: ./secrets/localops_encryption_key }
  bootstrap_admin_password: { file: ./secrets/bootstrap_admin_password }

x-runtime-secrets: &runtime-secrets
  APP_SECRET_KEY: ""
  APP_SECRET_KEY_FILE: /run/secrets/app_secret_key
  DB_APP_PASSWORD: ""
  DB_APP_PASSWORD_FILE: /run/secrets/localops_app_password
  LOCALOPS_ENCRYPTION_KEY: ""
  LOCALOPS_ENCRYPTION_KEY_FILE: /run/secrets/localops_encryption_key

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      LOCALOPS_OWNER_PASSWORD: ""
      LOCALOPS_OWNER_PASSWORD_FILE: /run/secrets/localops_owner_password
      LOCALOPS_APP_PASSWORD: ""
      LOCALOPS_APP_PASSWORD_FILE: /run/secrets/localops_app_password
    secrets: [postgres_superuser_password, localops_owner_password, localops_app_password]

  migrate:
    environment:
      <<: *runtime-secrets
      DB_OWNER_PASSWORD: ""
      DB_OWNER_PASSWORD_FILE: /run/secrets/localops_owner_password
      BOOTSTRAP_ADMIN_PASSWORD: ""
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets:
      [app_secret_key, localops_app_password, localops_encryption_key,
       localops_owner_password, bootstrap_admin_password]

  api:
    environment: *runtime-secrets
    secrets: [app_secret_key, localops_app_password, localops_encryption_key]

  worker:
    environment: *runtime-secrets
    secrets: [app_secret_key, localops_app_password, localops_encryption_key]
