# LocalOps edge reverse proxy: the only container with a published port.
#   /        -> frontend (static SPA)
#   /api/    -> FastAPI backend
# /metrics and other backend-internal paths are intentionally NOT proxied.

# Resolve container names through Docker's DNS at request time (cached 10 s) rather
# than once at startup, so recreating api/frontend (new IP) never leaves nginx
# pointing at a dead address (502 Bad Gateway).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Per-client limit on credential endpoints (on top of the API's own login limiter).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location = /api/v1/auth/login {
        limit_req zone=auth burst=10 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events (investigation streaming, Phase 2) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        set $frontend_upstream http://frontend:8080;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
