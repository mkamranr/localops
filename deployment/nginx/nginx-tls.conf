# LocalOps edge reverse proxy with HTTPS (used by docker-compose.tls.yml).
#   8443 (LOCALOPS_HTTPS_PORT) -> HTTPS: frontend + /api/
#   8080 (LOCALOPS_HTTP_PORT)  -> permanent redirect to HTTPS
# Certificate and key: deployment/tls/server.crt + server.key (self-signed by the
# installer by default; replace them with your own and restart nginx).
# /metrics and other backend-internal paths are intentionally NOT proxied.

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # The published HTTPS port; install.sh rewrites it when LOCALOPS_HTTPS_PORT differs.
    location / {
        set $https_port 8443;
        return 301 https://$host:$https_port$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 25m;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Browsers ignore HSTS received over a certificate they don't trust, so this is safe
    # with the self-signed default and takes effect once a trusted certificate is used.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location = /api/v1/auth/login {
        limit_req zone=auth burst=10 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events (investigation streaming) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        set $frontend_upstream http://frontend:8080;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
